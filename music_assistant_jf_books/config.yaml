name: Music Assistant (Jellyfin books)
version: 2.10.9-jfbooks.1
slug: music_assistant_jf_books
description:
  The official Music Assistant server, with audiobook support added to its Jellyfin provider.
url: https://github.com/MSMGreen/ha-addons/tree/main/music_assistant_jf_books
arch:
  - amd64
homeassistant_api: true
hassio_api: true
hassio_role: manager
discovery:
  - music_assistant
  - mcp
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: Music Assistant
panel_admin: false
uart: false
apparmor: true
map:
  - media:rw
  - ssl:ro
init: false
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
  - library.db.backup
stage: experimental
tmpfs: true
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
